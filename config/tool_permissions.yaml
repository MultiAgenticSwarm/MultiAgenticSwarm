# Enhanced Tool Permission Configuration
# Compatible with existing ToolNodeManager system
# This file defines which agents can use which tools and under what conditions
# Change this file to modify permissions without touching the code

# Global Settings
global_settings:
  default_tool_access: true # Allow access to tools not explicitly listed
  enable_workflow_restrictions: true # Enable workflow phase-based restrictions
  enable_resource_quotas: true # Enable resource and quota checking
  log_permission_decisions: true # Log all permission allow/deny decisions

# Role Definitions
roles:
  basic_agent:
    description: "Basic agent with limited access"
    allowed_tools:
      - EmailSender
      - SlackNotifier
      - FileManager

  data_analyst:
    description: "Data analysis specialist"
    allowed_tools:
      - DataAPIFetcher
      - DatabaseConnector
      - DataProcessor
      - EmailSender
      - SlackNotifier
      - FileManager

  report_generator:
    description: "Report creation specialist"
    allowed_tools:
      - DataProcessor
      - DocumentGenerator
      - EmailSender
      - SlackNotifier
      - FileManager

  action_executor:
    description: "Business action execution specialist"
    allowed_tools:
      - DataProcessor
      - DocumentGenerator
      - EmailSender
      - SlackNotifier
      - FileManager

  notification_agent:
    description: "Notification and alert specialist"
    allowed_tools:
      - EmailSender
      - SlackNotifier
      - FileManager

  developer:
    description: "Software developer"
    allowed_tools:
      - calculator
      - logger
      - text_processor
      - file_writer
      - code_executor
      - git_manager

  admin:
    description: "Full system administrator"
    allowed_tools:
      - DataAPIFetcher
      - DatabaseConnector
      - DataProcessor
      - DocumentGenerator
      - EmailSender
      - SlackNotifier
      - FileManager

# Agent Tool Permissions
agent_permissions:
  DataAnalyst:
    description: "Agent specialized in data analysis and processing"
    role: data_analyst
    allowed_tools:
      - DatabaseConnector # Additional database access
    denied_tools:
      - DocumentGenerator # Cannot generate documents directly

  ActionExecutor:
    description: "Agent specialized in executing business actions"
    role: action_executor
    allowed_tools: [] # Only role-based permissions
    denied_tools:
      - DataAPIFetcher # Cannot fetch raw data directly
      - DatabaseConnector # Cannot access database directly

  ReportGenerator:
    description: "Agent specialized in creating reports and documents"
    role: report_generator
    allowed_tools: [] # Role permissions are sufficient
    denied_tools:
      - DataAPIFetcher # Cannot fetch raw data directly
      - DatabaseConnector # Cannot access database directly

  NotificationAgent:
    description: "Agent specialized in notifications and alerts"
    role: notification_agent
    allowed_tools: [] # Role permissions are sufficient
    denied_tools:
      - DataAPIFetcher # Cannot fetch data
      - DatabaseConnector # Cannot access database
      - DataProcessor # Cannot process data
      - DocumentGenerator # Cannot generate documents

# Tool Scope Definitions
tool_scopes:
  # Global tools - available to all agents by default
  EmailSender:
    scope: GLOBAL
    description: "Email sending functionality for all agents"

  SlackNotifier:
    scope: GLOBAL
    description: "Slack notification functionality for all agents"

  FileManager:
    scope: GLOBAL
    description: "File management operations for all agents"

  # Shared tools - available to specific agents
  DataProcessor:
    scope: SHARED
    shared_agents:
      - DataAnalyst
      - ActionExecutor
      - ReportGenerator
    description: "Data processing and transformation"

  DocumentGenerator:
    scope: SHARED
    shared_agents:
      - ReportGenerator
      - ActionExecutor
    description: "Document generation and formatting"

  # Local tools - available to one agent only
  DataAPIFetcher:
    scope: LOCAL
    local_agent: DataAnalyst
    description: "API data fetching - analyst only"

  DatabaseConnector:
    scope: LOCAL
    local_agent: DataAnalyst
    description: "Database connectivity - analyst only"

# Workflow Phase Restrictions
workflow_restrictions:
  planning:
    description: "Initial planning phase - limited tool access"
    restricted_tools:
      - DatabaseConnector # No database access during planning
      - DataAPIFetcher # No external data fetching during planning
      - EmailSender # No email sending during planning

  development:
    description: "Active development phase"
    restricted_tools:
      - EmailSender # Limit external communications during development

  testing:
    description: "Testing phase - read-only for data sources"
    restricted_tools:
      - EmailSender # No external communications during testing
      - SlackNotifier # No notifications during testing

  production:
    description: "Production deployment - strict controls"
    restricted_tools:
      - DataAPIFetcher # No data fetching in production
      - DatabaseConnector # No direct database access in production
    allowed_agents: # Only these agents can use tools in production
      - NotificationAgent

# Resource Quotas and Limits
resource_limits:
  api_calls_per_hour: 1000
  max_file_size_mb: 50
  max_files_per_operation: 100
  max_db_queries_per_minute: 50
  max_db_records_per_query: 1000
  max_memory_storage_mb: 100

# Tool Usage Quotas
tool_usage_quotas:
  DataAPIFetcher:
    quota_per_hour: 100
    description: "External API data fetching calls"

  DatabaseConnector:
    quota_per_hour: 200
    description: "Database connection operations"

  EmailSender:
    quota_per_day: 50
    description: "Email sending operations"

  SlackNotifier:
    quota_per_hour: 20
    description: "Slack notification sends"

  DocumentGenerator:
    quota_per_day: 25
    description: "Document generation operations"
